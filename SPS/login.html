<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CampusVerse Login</title>
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="left">
            <h1>CampusVerse</h1>
            <p>Learn • Connect • Build • Grow</p>
            <img src="images/login.png" alt="CampusVerse">
        </div>
        <div class="right">
            <div class="login-box">
                <h2>Welcome Back 👋</h2>
                <p>Login to continue</p>
                <div class="tabs">
                    <button type="button" class="tab active" onclick="showStudent()">Student</button>
                    <button type="button" class="tab" onclick="showAdmin()">Admin</button>
                </div>
                <form id="studentForm" onsubmit="return studentLogin()">
                    <div class="input-box">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" placeholder="Student ID" required>
                    </div>
                    <div class="input-box">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" placeholder="College Email" required>
                    </div>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <div class="remember">
                        <label>
                            <input type="checkbox">Remember Me
                        </label>
                        <a href="#">Forgot Password?</a>
                    </div>
                    <button type="submit" class="login-btn">Login</button>
                    <p class="signup">New Student?
                        <a href="#">Register Now</a>
                    </p>
                </form>
                <form id="adminForm" style="display:none;" onsubmit="return adminLogin()">
                    <div class="input-box">
                        <i class="fa-solid fa-user-shield"></i>
                        <input type="text" placeholder="Admin ID" required>
                    </div>
                    <div class="input-box">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" placeholder="Password" required>
                    </div>
                    <button type="submit" class="login-btn">Admin Login</button>
                </form>
            </div>
        </div>
    </div>
    <script>
    const studentForm = document.getElementById("studentForm");
    const adminForm = document.getElementById("adminForm");
    const tabs = document.querySelectorAll(".tab");
    function showStudent() {
        studentForm.style.display = "block";
        adminForm.style.display = "none";
        tabs[0].classList.add("active");
        tabs[1].classList.remove("active");
    }
    function showAdmin() {
        studentForm.style.display = "none";
        adminForm.style.display = "block";
        tabs[1].classList.add("active");
        tabs[0].classList.remove("active");
    }
    function studentLogin() {
        window.location.href = "index.html";
        return false;
    }
    </script>
</body>
</html>
